# mPod AI gateway on the DGX Spark: the ONLY thing the internet can reach on this machine.
#
#   AWS (mPod backend) --HTTPS + API key--> this gateway --> 127.0.0.1 model servers
#
#   /api/chat, /api/show, /api/version, /api/ps  -> Ollama (127.0.0.1:11434)    LLM tasks
#   /v1/chat/completions, /v1/models             -> OpenAI-compatible server    LLM tasks (optional:
#                                                    vLLM / TensorRT-LLM on 127.0.0.1:8000)
#   /vision/health, /vision/v1/face/analyze      -> camera model (127.0.0.1:8100)
#   anything else (pull, delete, create, push ...) -> 404
#
# Install:
#   sudo cp mpod-ai-gateway.conf /etc/nginx/sites-available/mpod-ai-gateway
#   sudo sed -i 's/ai.example.edu/<your-domain>/g' /etc/nginx/sites-available/mpod-ai-gateway
#   sudo touch /etc/nginx/mpod-ai-keys.conf && sudo chmod 640 /etc/nginx/mpod-ai-keys.conf && sudo chown root:www-data /etc/nginx/mpod-ai-keys.conf
#   sudo ln -s /etc/nginx/sites-available/mpod-ai-gateway /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Keys: sudo ./make-api-key.sh create <client-name>   (see DEPLOYMENT.md, part A)

# "Bearer <key>" -> client name. Lines in the keys file look like:  "Bearer 3f9c...e1" "aws-prod";
map $http_authorization $mpod_client {
    default "";
    include /etc/nginx/mpod-ai-keys.conf;
}

# Per-client request limits (all AWS traffic may come from one IP, so limit by key).
limit_req_zone $mpod_client zone=mpod_llm:10m    rate=30r/s;
limit_req_zone $mpod_client zone=mpod_vision:10m rate=300r/s;
limit_req_status 429;

# Never write API keys to the logs.
log_format mpod_ai '$remote_addr [$time_local] client=$mpod_client "$request_method $uri" '
                   '$status $body_bytes_sent ${request_time}s upstream=${upstream_response_time}s';

upstream mpod_ollama { server 127.0.0.1:11434; keepalive 16; }
upstream mpod_openai_compat { server 127.0.0.1:8000; keepalive 16; }
upstream mpod_vision { server 127.0.0.1:8100; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name ai.example.edu;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Ubuntu 24.04 ships nginx 1.24; on nginx >= 1.25 write "listen 443 ssl;" plus "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.example.edu;

    ssl_certificate     /etc/letsencrypt/live/ai.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    access_log /var/log/nginx/mpod-ai.access.log mpod_ai;
    server_tokens off;

    # Strongly recommended: accept only the AWS servers' public IPs (Elastic IP / NAT gateway).
    # allow 203.0.113.25;
    # deny all;

    # Prompts and camera frames are small.
    client_max_body_size 2m;

    # Every request needs a valid API key.
    if ($mpod_client = "") { return 401 '{"error":"invalid or missing API key"}'; }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The key is checked here; the model servers never see it.
    proxy_set_header Authorization "";
    proxy_set_header X-Mpod-Client $mpod_client;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;

    # ---- LLMs through Ollama (DGX_PROTOCOL=ollama)
    location = /api/chat    { limit_req zone=mpod_llm burst=200 nodelay; proxy_pass http://mpod_ollama; }
    location = /api/show    { limit_req zone=mpod_llm burst=200 nodelay; proxy_pass http://mpod_ollama; }
    location = /api/version { proxy_pass http://mpod_ollama; }
    location = /api/ps      { proxy_pass http://mpod_ollama; }

    # ---- LLMs through an OpenAI-compatible server (DGX_PROTOCOL=openai).
    # For vLLM / TensorRT-LLM on port 8000 keep as is; to use Ollama's /v1 instead,
    # change mpod_openai_compat to mpod_ollama.
    location = /v1/chat/completions { limit_req zone=mpod_llm burst=200 nodelay; proxy_pass http://mpod_openai_compat; }
    location = /v1/models           { proxy_pass http://mpod_openai_compat; }

    # ---- Camera model (DGX_VISION_URL=https://ai.example.edu/vision)
    location = /vision/health              { proxy_pass http://mpod_vision/health; proxy_read_timeout 15s; }
    location = /vision/v1/face/analyze     { limit_req zone=mpod_vision burst=600 nodelay; proxy_pass http://mpod_vision/v1/face/analyze; proxy_read_timeout 15s; }

    # Everything else (model pull/delete/create, admin APIs) is not reachable from outside.
    location / { return 404 '{"error":"not found"}'; }

    default_type application/json;
}
