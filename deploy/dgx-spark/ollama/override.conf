# Ollama server settings for mPod on the DGX Spark (128 GB unified memory).
# Install: sudo mkdir -p /etc/systemd/system/ollama.service.d
#          sudo cp override.conf /etc/systemd/system/ollama.service.d/override.conf
#          sudo systemctl daemon-reload && sudo systemctl restart ollama
# (If Ollama runs in Docker instead, pass the same values with -e and publish the port
#  only on 127.0.0.1: -p 127.0.0.1:11434:11434)

[Service]
# Only this machine may call the models. Never expose 11434 to the network.
Environment="OLLAMA_HOST=127.0.0.1:11434"
# Requests served at the same time per model. Keep backend OLLAMA_MAX_CONCURRENCY <= this.
Environment="OLLAMA_NUM_PARALLEL=4"
# gpt-oss:120b + gpt-oss:20b + qwen3-coder:30b stay loaded together (~100 GB).
Environment="OLLAMA_MAX_LOADED_MODELS=3"
# Never unload models (a cold 120b model takes a while to load).
Environment="OLLAMA_KEEP_ALIVE=-1"
# Default context window; the backend also sends num_ctx per request (OLLAMA_NUM_CTX).
Environment="OLLAMA_CONTEXT_LENGTH=8192"
# Less memory per parallel request.
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
