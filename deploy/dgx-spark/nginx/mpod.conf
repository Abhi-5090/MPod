# mPod on the DGX Spark: nginx in front of everything.
#   https://DOMAIN/          student website + kiosk   (frontend/build)
#   https://DOMAIN/admin/    admin portal              (Admin/build)
#   https://DOMAIN/backend/  API                       (Node on 127.0.0.1:8002)
#
# Install: copy to /etc/nginx/sites-available/mpod, replace every mpod.example.edu with your domain,
# link into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
# HTTPS is required: browsers only allow the camera and microphone on secure pages.

upstream mpod_backend {
    server 127.0.0.1:8002;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name mpod.example.edu;

    # Let's Encrypt HTTP challenge (certbot --webroot -w /var/www/certbot)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Ubuntu 24.04 ships nginx 1.24; on nginx >= 1.25 write "listen 443 ssl;" plus "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mpod.example.edu;

    ssl_certificate     /etc/letsencrypt/live/mpod.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mpod.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Profile-picture ZIPs are up to 50 MB.
    client_max_body_size 60m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API
    location /backend/ {
        proxy_pass http://mpod_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Starting an interview can wait for AI question generation.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ---- Admin portal (built with base /admin/)
    location = /admin { return 301 /admin/; }
    location /admin/assets/ {
        alias /opt/mpod/Admin/build/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
    location /admin/ {
        alias /opt/mpod/Admin/build/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # ---- Student website and kiosk
    root /opt/mpod/frontend/build;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
