# Self-managed MongoDB for mPod (only if you don't use MongoDB Atlas or your current
# database): single-node replica set (needed for the credit transactions), reachable
# only from this machine, with authentication.
# Install: sudo cp mongod.conf /etc/mongod.conf && sudo systemctl restart mongod
# First-time setup (replica set, users, key file): see DEPLOYMENT.md, part B.

storage:
  dbPath: /var/lib/mongodb

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  bindIp: 127.0.0.1

processManagement:
  timeZoneInfo: /usr/share/zoneinfo

replication:
  replSetName: rs0

# Enable after creating the users (DEPLOYMENT.md, part B).
